rules:
  - >
    No dataset may be imported until its version or retrieval date has
    been recorded.

  - >
    No dataset may be imported until its reuse terms have been reviewed.

  - >
    Each output edge must retain the original source database and source
    record identifier.

  - >
    Records redistributed by more than one database must not be counted
    as independent evidence without confirming separate provenance.

  - >
    Binding assays and functional assays must remain distinguishable.

  - >
    Predicted protein associations and experimentally supported physical
    interactions must remain distinguishable.

  - >
    Raw downloaded files must not be committed to Git.

  - >
    Processing scripts and small provenance summaries must be committed
    to Git.